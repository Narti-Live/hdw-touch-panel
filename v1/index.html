<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#16181c">
<title>HdW Touch Panel Prototype</title>
<style>
:root{
  --navy:#0c3a78; --navy-d:#082d5e; --navy-l:#e3ebf6;
  --bg:#f4f6f9; --head:#eef2f7; --card:#f3f5f8; --tile:#e8ecf1; --tile-h:#dfe4eb;
  --line:#d6dce4; --text:#131a24; --muted:#525c6a; --red:#c62828; --green:#1f8a4c;
  --amber:#c47a00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#16181c;overflow:hidden;
  font-family:"Segoe UI",Roboto,"Helvetica Neue",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#device{position:absolute;left:50%;top:50%;width:1336px;height:776px;transform-origin:center center;
  border-radius:44px;padding:28px;background:linear-gradient(145deg,#2b2e33,#0d0e10 60%,#1d1f23);
  box-shadow:0 0 0 2px #3a3d43 inset,0 20px 60px rgba(0,0,0,.6)}
.screen{position:relative;width:1280px;height:720px;border-radius:14px;overflow:hidden;background:var(--bg);color:var(--text)}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- controls outside the panel ---------- */
#ctrl{position:fixed;left:max(8px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:50}
#ctrl button{width:44px;height:44px;border-radius:10px;border:1px solid #3a3e45;background:#25282d;color:#cfd5dd;font:600 15px/1 inherit;font-family:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer}
#ctrl button.on{background:#0c3a78;border-color:#2f63a8;color:#fff}
#ctrl small{color:#7d8590;font-size:10px;text-align:center;letter-spacing:.04em}
#ctrl svg.i{font-size:22px}
#rotate{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;color:#aab2bd;font-size:14px;display:none}
@media (orientation:portrait){#rotate{display:block}#ctrl{top:auto;bottom:60px;transform:none;flex-direction:row;left:50%;translate:-50% 0}}

/* ---------- shared widgets ---------- */
.card{background:var(--card);border:1px solid #e1e6ec;border-radius:14px;padding:20px 24px}
.card h3{margin:0 0 16px;font-size:23px;font-weight:600}
.btn{border:0;font-family:inherit;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:14px;transition:background .15s,transform .08s}
.btn:active{transform:scale(.98)}
.tilebtn{background:var(--tile);border:1px solid #dde2e9;border-radius:14px;flex-direction:column;gap:10px;font-size:24px;font-weight:600}
.tilebtn svg.i{font-size:46px}
.tilebtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.tilebtn.warn.active{background:#fdecea;color:var(--red);border-color:#f4b6b0}
.dd{position:relative}
.dd-btn{width:100%;height:100%;border:1.5px solid #c9d1db;background:#fff;border-radius:10px;padding:0 18px;display:flex;align-items:center;gap:14px;font-size:22px;font-family:inherit;color:var(--text);cursor:pointer;text-align:left}
.dd-btn .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-btn svg.i{font-size:28px}
.dd-btn .chev{font-size:22px}
.dd.open .dd-btn{border:2.5px solid var(--navy)}
.dd-menu{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;border:1px solid #d9dfe7;border-radius:10px;box-shadow:0 14px 30px rgba(10,30,60,.18);padding:6px 0;z-index:30}
.dd-item{display:flex;align-items:center;gap:18px;padding:0 22px;height:58px;font-size:21px;cursor:pointer}
.dd-item svg.i{font-size:28px}
.dd-item .lbl{flex:1}
.dd-item.sel{background:#e5ecf6}
.dd-item .ck{color:var(--navy);font-size:26px}
.sl-row{display:flex;align-items:center;gap:18px}
.sl{position:relative;flex:1;height:44px;cursor:pointer;touch-action:none}
.sl::before{content:"";position:absolute;left:0;right:0;top:50%;height:12px;margin-top:-6px;border-radius:6px;background:#d9dee5}
.sl-fill{position:absolute;left:0;top:50%;height:12px;margin-top:-6px;border-radius:6px;background:var(--navy)}
.sl-th{position:absolute;top:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:#fff;border:1px solid #c7ced8;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.sl.muted .sl-fill{background:#9aa4b1}
.pct{width:70px;text-align:right;font-size:22px;color:#333c48;font-variant-numeric:tabular-nums}
.pagehead{display:flex;align-items:center;gap:26px;margin-bottom:26px}
.pagehead>svg.i{font-size:72px}
.pagehead h1{margin:0;font-size:42px;font-weight:700;letter-spacing:-.01em}
.pagehead p{margin:4px 0 0;font-size:21px;color:var(--muted)}
.status{display:flex;align-items:center;gap:10px;font-size:18px;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;background:#9aa4b1}
.dot.on{background:var(--green);box-shadow:0 0 0 4px rgba(31,138,76,.15)}
.dot.busy{background:var(--amber);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.overlay{position:absolute;inset:0;background:rgba(244,246,249,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:20;font-size:26px;font-weight:600;color:var(--navy)}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid #cdd7e5;border-top-color:var(--navy);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.modal-bg{position:absolute;inset:0;background:rgba(10,20,35,.45);display:flex;align-items:center;justify-content:center;z-index:60}
.modal{width:560px;background:#fff;border-radius:18px;padding:34px 36px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal h2{margin:0 0 10px;font-size:30px}
.modal p{margin:0 0 28px;font-size:20px;color:var(--muted)}
.modal .row{display:flex;gap:16px}
.modal .btn{flex:1;height:64px;border-radius:12px;font-size:21px;font-weight:600}
#toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:#1c2633;color:#fff;padding:16px 28px;border-radius:12px;font-size:20px;opacity:0;transition:.25s;z-index:70;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
#clean{position:absolute;inset:0;background:#000;color:#fff;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:30px}
#clean.show{display:flex}
#clean b{font-size:90px}

/* ---------- Design A ---------- */
.A .hdr{height:96px;display:flex;align-items:center;padding:0 36px;background:var(--head);border-bottom:1px solid #e2e7ee}
.A .logo{display:flex;align-items:center;gap:18px;color:var(--navy)}
.A .logo svg{width:50px;height:50px}
.A .logo div{font-size:24px;font-weight:800;line-height:1;letter-spacing:.01em}
.A .logo div span{display:block;font-size:30px}
.A .vsep{width:1.5px;height:56px;background:#c9d0da;margin:0 30px}
.A .ttl b{display:block;font-size:22px;font-weight:700}
.A .ttl span{font-size:19px;color:var(--muted)}
.A .room{margin-left:auto;width:296px;height:56px}
.A .room .dd-btn{background:#e9edf2;font-size:24px;font-weight:600}
.A .lang{margin-left:28px;width:112px;height:50px}
.A .lang .dd-btn{font-size:20px;color:#555f6c;padding:0 12px 0 18px;gap:6px}
.A .lang .dd-menu{left:auto;width:230px}
.A .body{display:grid;grid-template-columns:262px 1fr;height:532px}
.A nav{padding:28px 0 0 6px;display:flex;flex-direction:column;gap:12px}
.A nav .btn{height:86px;border-radius:12px;background:var(--tile);justify-content:flex-start;padding:0 18px;font-size:22px;gap:16px;white-space:nowrap}
.A nav .btn svg.i{font-size:40px}
.A nav .btn.active{background:var(--navy);color:#fff;font-weight:600}
.A main{position:relative;padding:26px 30px 0 36px}
.A .ftr{height:92px;border-top:1px solid #e2e7ee;display:flex;align-items:center;padding:0 36px 0 40px;gap:24px}
.A .ftr .btn{width:334px;height:60px;border-radius:10px;font-size:24px}
.A .ftr .btn svg.i{font-size:34px}
.A .pwr-off{background:#e3e7ec}
.A .pwr-on{background:var(--navy);color:#fff;font-weight:600}
.A .ftr .status{margin:0 auto}

/* ---------- Design B ---------- */
.B{background:#fff}
.B .hdr{height:100px;display:flex;align-items:center;background:#f3f5f8}
.B .logo{height:100px;width:278px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding-left:40px;clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
.B .logo svg{width:46px;height:46px}
.B .logo div{font-size:24px;font-weight:500;line-height:1}
.B .logo div span{display:block;font-size:30px;font-weight:800}
.B .vsep{width:1.5px;height:58px;background:#c3cad4;margin:0 30px 0 10px}
.B .ttl b{display:block;font-size:27px;font-weight:700}
.B .ttl span{font-size:21px;color:var(--muted)}
.B .room{margin-left:auto;width:330px;height:58px}
.B .room .dd-btn{font-size:24px;font-weight:600}
.B .room .dd-btn svg.i:first-child{font-size:30px}
.B .clock{font-size:31px;font-weight:600;padding:0 34px 0 30px;border-left:1.5px solid #555;margin-left:32px;height:44px;display:flex;align-items:center;font-variant-numeric:tabular-nums}
.B .body{display:grid;grid-template-columns:268px 1fr;height:620px}
.B nav{background:#f1f3f6;padding:40px 18px 0 12px;display:flex;flex-direction:column;gap:14px}
.B nav .btn{height:68px;border-radius:9px;background:#e6e9ee;justify-content:flex-start;padding:0 14px;font-size:20px;gap:14px;white-space:nowrap}
.B nav .btn svg.i{font-size:32px}
.B nav .btn.active{background:var(--navy);color:#fff;font-weight:600}
.B .right{display:flex;flex-direction:column;position:relative}
.B main{position:relative;flex:1;padding:30px 30px 0 36px}
.B .ftr{height:102px;display:flex;align-items:center;padding:0 26px 14px 26px;background:linear-gradient(#fff,#f3f5f8)}
.B .ftr .btn{width:262px;height:68px;border-radius:9px;font-size:22px}
.B .ftr .btn svg.i{font-size:36px}
.B .pwr-off{background:#f5f6f8;border:1.5px solid #c7ced8}
.B .pwr-on{background:var(--navy);color:#fff;font-weight:600}
.B .ftr .status{margin:0 auto}
.B .pagehead>svg.i{font-size:60px}
.B .pagehead h1{font-size:38px}

/* start page (B) */
.qs{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-bottom:46px}
.qs .btn{height:104px;border-radius:9px;background:#e8ebef;font-size:27px;font-weight:700;justify-content:flex-start;padding:0 50px;gap:56px;position:relative}
.qs .btn svg.i{font-size:58px}
.qs .btn.active{background:var(--navy);color:#fff}
.qs .btn .ok{position:absolute;right:22px;top:22px;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center}
.qs .btn .ok svg.i{font-size:24px;stroke-width:3}
.two .dd{height:74px}
.two{display:grid;grid-template-columns:1fr 1.25fr;gap:18px}
.B .card{background:#f4f6f8;border:0;border-radius:9px}
.lvl{background:#eef1f4;border-radius:8px;padding:6px 14px}
.lvl .sl-row{height:86px}
.lvl .sl-row .nm{display:flex;align-items:center;gap:16px;width:190px;font-size:22px}
.lvl .sl-row .nm svg.i{font-size:34px}

/* presentation page */
.pres{display:grid;grid-template-columns:432px 1fr;gap:34px}
.pres .src{height:286px}
.pres .src .dd{height:62px}
.pres .aud{display:flex;flex-direction:column;gap:22px}
.pres .aud .card{height:146px}
.pres .aud .card .sl-row svg.i{font-size:46px}
.pres .tiles{display:grid;grid-template-columns:1fr 1fr;gap:18px;height:154px}
.disp{margin-top:18px;font-size:18px;color:var(--muted);display:flex;align-items:center;gap:10px}

/* vc page */
.vc{display:grid;grid-template-columns:470px 1fr;gap:28px}
.selfview{height:252px;border-radius:14px;background:linear-gradient(135deg,#253446,#101822);color:#c9d3df;position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;font-size:19px;overflow:hidden}
.selfview svg.i{font-size:56px;opacity:.7}
.selfview .tag{position:absolute;left:14px;top:12px;font-size:16px;background:rgba(0,0,0,.4);padding:4px 10px;border-radius:6px}
.selfview .live{position:absolute;right:14px;top:12px;font-size:16px;background:var(--red);color:#fff;padding:4px 10px;border-radius:6px}
.callbtn{margin-top:18px;height:70px;width:100%;border-radius:12px;font-size:23px;font-weight:600;background:var(--green);color:#fff}
.callbtn.end{background:var(--red)}
.callbtn svg.i{font-size:30px}
.vc h4{margin:0 0 12px;font-size:20px;font-weight:600;color:var(--muted)}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.presets .btn{height:74px;border-radius:12px;background:var(--tile);font-size:20px;border:1px solid #dde2e9}
.presets .btn.active{background:var(--navy-l);border:2px solid var(--navy);color:var(--navy);font-weight:600}
.vc .tg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;height:132px}
.vc .tilebtn{font-size:20px}
.vc .tilebtn svg.i{font-size:40px}

/* audio page */
.mix{display:flex;flex-direction:column;gap:12px}
.mix .ch{display:flex;align-items:center;gap:20px;background:var(--card);border:1px solid #e1e6ec;border-radius:12px;padding:0 18px 0 22px;height:82px}
.B .mix .ch{border:0;background:#f4f6f8}
.mix .ch .nm{display:flex;align-items:center;gap:16px;width:250px;font-size:21px}
.mix .ch .nm svg.i{font-size:34px}
.mix .ch .mb{width:120px;height:58px;border-radius:10px;background:var(--tile);font-size:18px;border:1px solid #d7dde5;gap:8px}
.mix .ch .mb svg.i{font-size:24px}
.mix .ch .mb.active{background:#fdecea;color:var(--red);border-color:#f4b6b0;font-weight:600}

/* system page */
.sys{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.sys .tl{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sys .tilebtn{height:150px;font-size:20px}
.sys .tilebtn svg.i{font-size:42px}
.sys .tilebtn small{font-size:16px;font-weight:500;opacity:.8}
.info{list-style:none;margin:0;padding:0}
.info li{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid #e1e6ec;font-size:19px}
.info li:last-child{border:0}
.info li span{color:var(--muted)}
.disclaimer{margin-top:14px;font-size:15px;color:#7a8492}

/* ---------- Design C ---------- */
.C{--dk:#1e2733;background:#f6f7f9}
.C .sl-fill{background:var(--dk)}
.C .hdr{height:92px;background:var(--dk);color:#fff;display:flex;align-items:center;padding:0 34px 0 40px}
.C .logo{display:flex;align-items:center;gap:14px}
.C .logo svg{width:44px;height:44px}
.C .logo div{font-size:21px;font-weight:500;line-height:1}
.C .logo div span{display:block;font-size:26px;font-weight:800}
.C .vsep{width:1.5px;height:44px;background:#8a95a5;margin:0 24px}
.C .hname{font-size:25px;color:#e3e8ee}
.C .hroom{font-size:27px;font-weight:700;margin-left:50px}
.C .clock{margin-left:auto;font-size:28px;font-variant-numeric:tabular-nums}
.C .hicon{margin-left:46px;width:56px;height:56px;border:0;background:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:10px}
.C .hicon svg.i{font-size:42px}
.C .hicon:active{background:rgba(255,255,255,.12)}
.C main{position:relative;height:628px;padding:30px 36px}
.C .btn.dark{background:var(--dk);color:#fff}
.C .home h1{margin:14px 0 4px 20px;font-size:50px;font-weight:700}
.C .home p{margin:0 0 40px 20px;font-size:26px;color:#3f5f86}
.C .rooms{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.C .rooms .btn{height:330px;border-radius:14px;background:#eceef1;border:1px solid #e1e4e8;flex-direction:column;align-items:flex-start;justify-content:center;padding:0 36px;gap:10px;text-align:left;position:relative}
.C .rooms .btn svg.i{font-size:84px;stroke-width:1.5}
.C .rooms .btn b{font-size:38px;margin-top:20px}
.C .rooms .btn span{font-size:24px;color:#4a5361}
.C .rooms .btn .go{position:absolute;right:30px;bottom:52px;font-size:34px}
.C .rooms .btn .st{position:absolute;right:30px;top:28px;display:flex;align-items:center;gap:8px;font-size:17px;color:#4a5361}
.C .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px}
.C .tabs .btn{height:72px;border-radius:9px;background:#eceef1;font-size:24px;gap:16px}
.C .tabs .btn svg.i{font-size:38px}
.C .tabs .btn.active{background:var(--dk);color:#fff;font-weight:600}
.C .room main{padding-top:20px}
.C .lbl2{font-size:24px;font-weight:600;margin:0 0 12px}
.C .presC{display:grid;grid-template-columns:1fr 445px;gap:30px}
.C .presC .dd{height:70px}
.C .presC .dd-btn{font-size:25px;font-weight:600}
.C .presC .dd.open .dd-btn{border:1.5px solid #9aa5b3}
.C .panel{background:#eff1f4;border-radius:14px;padding:26px 28px}
.C .panel h3{display:flex;align-items:center;gap:20px;margin:0 0 22px;font-size:26px;font-weight:600}
.C .panel h3 svg.i{font-size:44px}
.C .onoff{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.C .onoff .btn{height:124px;border-radius:9px;background:#e2e5e9;flex-direction:column;gap:8px;font-size:25px}
.C .onoff .btn svg.i{font-size:44px}
.C .onoff .btn.active{background:var(--dk);color:#fff;font-weight:600}
.C .onoff.slim .btn{height:62px;flex-direction:row;gap:16px}
.C .onoff.slim .btn svg.i{font-size:34px}
.C .note2{margin-top:18px;font-size:19px;color:#4a5361;display:flex;align-items:center;gap:10px}
.C .aud3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.C .aud3 .ac{border:1px solid #d9dde3;background:#fafbfc;border-radius:12px;height:430px;display:flex;flex-direction:column;align-items:center;padding:30px 26px}
.C .aud3 .ac svg.i{font-size:56px}
.C .aud3 .ac b{font-size:27px;margin-top:22px}
.C .aud3 .ac b small{font-size:21px;font-weight:500}
.C .aud3 .ac .sl-row{width:100%;margin-top:40px;flex-direction:column;gap:6px}
.C .aud3 .ac .sl{width:100%;flex:none}
.C .aud3 .ac .pct{width:auto;text-align:center;font-size:20px;color:var(--muted)}
.C .pm{display:flex;justify-content:space-between;width:100%;margin-top:auto}
.C .pm .btn{width:84px;height:64px;border-radius:10px;background:#eceef1;border:1px solid #d2d7de;font-size:36px;font-weight:300}
.C .pm .btn.mt{width:auto;padding:0 14px;font-size:17px;gap:6px}
.C .pm .btn.mt svg.i{font-size:24px}
.C .pm .btn.mt.active{background:#fdecea;color:var(--red);border-color:#f4b6b0}
.C .erf{display:grid;grid-template-columns:1fr 1.5px 1fr;gap:34px;height:396px}
.C .erf .div{background:#cfd4db;margin:8px 0}
.C .scen{display:flex;flex-direction:column;gap:16px}
.C .scen .btn{height:122px;border-radius:9px;background:#eceef1;border:1px solid #dfe2e6;justify-content:flex-start;padding:0 34px;gap:34px;text-align:left;position:relative}
.C .scen .btn svg.i{font-size:58px}
.C .scen .btn b{display:block;font-size:27px}
.C .scen .btn span{font-size:25px;color:inherit;opacity:.85}
.C .scen .btn.active{background:var(--dk);color:#fff;border-color:var(--dk)}
.C .scen .btn .ck{position:absolute;right:34px;font-size:36px}
.C .rh{display:flex;align-items:center;gap:18px;font-size:26px;font-weight:600;margin:6px 0 16px}

    (r.inCall?'<span class="live">● '+t('vc_live')+' <span class="calltime">'+callTime()+'</span></span>':'')+
    (r.cam&&r.power==='on'?ic('users')+'<span>'+(r.inCall?t('vc_live'):t('vc_ready'))+'</span>':ic('videoOff')+'<span>'+t('cam_is_off')+'</span>')+'</div>';
  return head('video',t('vc'),t('vc_sub'))+
  '<div class="vc"><div>'+sv+'<button class="btn callbtn'+(r.inCall?' end':'')+'" data-act="call">'+ic('phone')+(r.inCall?t('vc_leave'):t('vc_join'))+'</button></div>'+
  '<div><h4>'+t('cam_pos')+'</h4><div class="presets">'+[0,1,2].map(function(i){return '<button class="btn'+(r.preset===i?' active':'')+'" data-act="preset:'+i+'">'+t('pr'+i)+'</button>';}).join('')+'</div>'+
  '<h4>'+t('funcs')+'</h4><div class="tg">'+
  '<button class="btn tilebtn'+(r.cam?' active':'')+'" data-act="cam">'+ic(r.cam?'video':'videoOff')+t('camera')+'</button>'+
  '<button class="btn tilebtn warn'+(r.mu.mic?' active':'')+'" data-act="mute:mic">'+ic(r.mu.mic?'micOff':'mic')+(r.mu.mic?t('mics_off'):t('mics'))+'</button>'+
  '<button class="btn tilebtn'+(r.share?' active':'')+'" data-act="share">'+ic('share')+t('share')+'</button></div></div></div>';}
function pgAudio(){var r=R();
  var ch=[['vol','ch_vol','speaker','speakerOff'],['mic','ch_mic','mic','micOff'],['m1','ch_m1','mic','micOff'],['m2','ch_m2','mic','micOff']];
  return head('sliders',t('audio'),t('audio_sub'))+'<div class="mix">'+ch.map(function(c){var m=r.mu[c[0]];
    return '<div class="ch"><span class="nm">'+ic(m?c[3]:c[2])+t(c[1])+'</span><div class="sl-row" style="flex:1">'+slider(c[0])+'</div>'+
    '<button class="btn mb'+(m?' active':'')+'" data-act="mute:'+c[0]+'">'+ic(c[3])+t('mute')+'</button></div>';}).join('')+'</div>';}
function pgSystem(){var r=R();var cur=SOURCES.filter(function(s){return s[0]===r.source;})[0];
  var st=r.power==='on'?t('st_on'):r.power==='off'?t('st_off'):(r.power==='booting'?t('st_boot'):t('st_stop'));
  return head('info',t('system'),t('sys_sub'))+
  '<div class="sys"><div class="tl">'+
  '<button class="btn tilebtn'+(r.display&&r.power==='on'?' active':'')+'" data-act="display">'+ic('monitor')+t('display')+'<small>'+(r.display&&r.power==='on'?t('on'):t('off'))+'</small></button>'+
  '<button class="btn tilebtn" data-act="lang:'+(S.lang==='de'?'en':'de')+'"><span style="font-size:34px;font-weight:800">'+(S.lang==='de'?'EN':'DE')+'</span>'+t('lang_t')+'</button>'+
  '<button class="btn tilebtn" data-act="help">'+ic('help')+t('help')+'</button>'+
  '<button class="btn tilebtn" data-act="clean">'+ic('clean')+t('clean')+'<small>'+t('lock')+'</small></button></div>'+
  '<div class="card"><h3>'+t('info')+'</h3><ul class="info">'+
  '<li><span>'+t('i_room')+'</span>'+t(ROOMS.filter(function(x){return x[0]===S.room;})[0][1])+'</li>'+
  '<li><span>'+t('i_status')+'</span>'+st+'</li>'+
  '<li><span>'+t('i_src')+'</span>'+t(cur[0])+'</li>'+
  '<li><span>'+t('i_panel')+'</span>Crestron TSW (Platzhalter)</li>'+
  '<li><span>'+t('i_ver')+'</span>Prototyp '+S.design+' · v0.1</li></ul>'+
  '<div class="disclaimer">'+t('demo')+'</div></div></div>';}
var PAGES={start:pgStart,pres:pgPres,vc:pgVC,audio:pgAudio,system:pgSystem};


/* ---------------- Design C ---------------- */
var SOURCES_C=[['hdmi','laptop','hdmi'],['usbc','laptop','usbc'],['pc','laptop','c_raumpc'],['wl','wireless','c_wl']];
var AUTO_LIMIT_REAL=20*60*1000, AUTO_LIMIT_DEMO=20*1000;
function autoLimit(){return S.cDemo?AUTO_LIMIT_DEMO:AUTO_LIMIT_REAL;}
function fmtLeft(ms){var s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+('0'+s%60).slice(-2);}
function autoText(){var r=S.rooms.erf;
  if(r.power!=='on')return t('c_paused');
  if(r.scenario===2)return t('c_active2');
  return t('c_left')+'<strong class="autoleft">'+fmtLeft(autoLimit()-(Date.now()-r.lastTouch))+'</strong>';}
function isOn(r){return r.power==='on'||r.power==='booting';}
function cHome(){
  function tile(id,icon,sub){var r=S.rooms[id];
    return '<button class="btn" data-act="croom:'+id+'"><span class="st"><span class="dot '+(r.power==='on'?'on':(r.power==='off'?'':'busy'))+'"></span>'+(r.power==='on'?t('on'):(r.power==='off'?t('off'):'…'))+'</span>'+ic(icon)+'<b>'+t(id==='sem'?'room_sem':'room_erf')+'</b><span>'+t(sub)+'</span><span class="go">'+ic('chevR')+'</span></button>';}
  return '<div class="home"><h1>'+t('c_title')+'</h1><p>'+t('c_pick')+'</p><div class="rooms">'+tile('sem','group','c_sem_sub')+tile('erf','screenPlay','c_erf_sub')+'</div></div>';}
function cPres(){var r=R();var cur=SOURCES_C.filter(function(s){return s[0]===r.source;})[0]||SOURCES_C[0];
  var dd=dropdown('source',cur[1],t(cur[2]),SOURCES_C.map(function(s){return {act:'src:'+s[0],icon:s[1],label:t(s[2]),sel:s[0]===r.source};}));
  return '<div class="presC"><div><div class="lbl2">'+t('c_srcimg')+'</div>'+dd+
    '<div class="note2"><span class="dot '+(r.power==='on'?'on':'')+'"></span>'+(r.power==='on'?t('disp_on')+': '+t(cur[2]):t('disp_off'))+'</div></div>'+
    '<div class="panel"><h3>'+ic('monitor')+t('c_anz')+'</h3><div class="onoff">'+
    '<button class="btn'+(isOn(r)?' active':'')+'" data-act="cpow:on">'+ic('power')+t('on')+'</button>'+
    '<button class="btn'+(!isOn(r)?' active':'')+'" data-act="cpow:off">'+ic('power')+t('off')+'</button></div></div></div>';}
function cAudio(){var r=R();
  function card(key,icon,label,small){return '<div class="ac">'+ic(r.mu[key]?(key==='mic'?'micOff':'speakerOff'):icon)+'<b>'+t(label)+(small?' <small>'+t(small)+'</small>':'')+'</b>'+
    '<div class="sl-row">'+slider(key)+'</div><div class="pm"><button class="btn" data-act="step:'+key+':-5">−</button>'+
    '<button class="btn mt'+(r.mu[key]?' active':'')+'" data-act="mute:'+key+'">'+ic(key==='mic'?'micOff':'speakerOff')+t('mute')+'</button>'+
    '<button class="btn" data-act="step:'+key+':5">+</button></div></div>';}
  return '<div class="aud3">'+card('vol','speaker','c_room_vol')+card('mic','mic','mics')+card('media','speakerPlay','c_media','c_media_s')+'</div>';}
function cCam(){var r=R();
  return '<div class="camC"><div class="selfview"><span class="tag">'+t('c_preview')+' · '+t('pr'+r.preset)+'</span>'+
    (r.cam&&r.power==='on'?ic('users')+'<span>'+t('pr'+r.preset)+'</span>':ic('videoOff')+'<span>'+t('cam_is_off')+'</span>')+'</div>'+
    '<div class="stack"><div class="lbl2">'+t('cam_pos')+'</div>'+[0,1,2].map(function(i){return '<button class="btn'+(r.preset===i?' active':'')+'" data-act="preset:'+i+'">'+ic('video')+t('pr'+i)+'</button>';}).join('')+
    '<button class="btn'+(r.cam?'':' warn active')+'" data-act="cam">'+ic(r.cam?'video':'videoOff')+(r.cam?t('camera')+': '+t('on'):t('cam_is_off'))+'</button></div></div>';}
function cVC(){var r=R();
  return '<div class="camC"><div><div class="selfview" style="height:270px"><span class="tag">'+t('selfview')+'</span>'+
    (r.inCall?'<span class="live">● '+t('vc_live')+' <span class="calltime">'+callTime()+'</span></span>':'')+
    (r.cam&&r.power==='on'?ic('users')+'<span>'+(r.inCall?t('vc_live'):t('vc_ready'))+'</span>':ic('videoOff')+'<span>'+t('cam_is_off')+'</span>')+'</div>'+
    '<button class="btn callbtn'+(r.inCall?' end':'')+'" data-act="call">'+ic('phone')+(r.inCall?t('vc_leave'):t('vc_join'))+'</button></div>'+
    '<div class="stack"><div class="lbl2">'+t('funcs')+'</div>'+
    '<button class="btn warn'+(r.mu.mic?' active':'')+'" data-act="mute:mic">'+ic(r.mu.mic?'micOff':'mic')+(r.mu.mic?t('mics_off'):t('mics'))+'</button>'+
    '<button class="btn'+(r.share?' active':'')+'" data-act="share">'+ic('share')+t('share')+'</button>'+
    '<button class="btn'+(r.cam?' active':'')+'" data-act="cam">'+ic(r.cam?'video':'videoOff')+t('camera')+'</button>'+
    '<div class="note2" style="margin-top:6px">'+ic('info')+'<span style="font-size:17px">'+t('c_vc_hint')+'</span></div></div></div>';}
function cErf(){var r=S.rooms.erf;
  function sc(n,icon){var a=r.scenario===n;return '<button class="btn'+(a?' active':'')+'" data-act="scen:'+n+'">'+ic(icon)+'<div><b>'+t('c_s'+n)+'</b><span>'+t('c_s'+n+'s')+'</span></div>'+(a?'<span class="ck">'+ic('check')+'</span>':'')+'</button>';}
  return '<div class="erf"><div><div class="lbl2" style="font-size:26px;margin:6px 0 18px">'+t('c_content')+'</div><div class="scen">'+sc(1,'image')+sc(2,'playC')+'</div></div><div class="div"></div>'+
    '<div><div class="rh">'+ic('projector')+t('c_proj')+'</div><div class="onoff slim">'+
    '<button class="btn'+(isOn(r)?' active':'')+'" data-act="cpow:on">'+ic('power')+t('on')+'</button>'+
    '<button class="btn'+(!isOn(r)?' active':'')+'" data-act="cpow:off">'+ic('power')+t('off')+'</button></div>'+
    '<div class="rh" style="margin-top:34px">'+ic(r.mu.vol?'speakerOff':'speaker')+t('volume')+' <span style="margin-left:auto;font-weight:400;font-size:22px;color:var(--muted)" data-pct="vol">'+r.lv.vol+' %</span></div>'+
    '<div class="volrow"><button class="btn" data-act="step:vol:-5">−</button>'+slider('vol')+'<button class="btn" data-act="step:vol:5">+</button></div></div></div>'+
    '<div class="auto">'+ic('clock')+'<div><b>'+t('c_auto')+'</b><span>'+t('c_auto_t')+'</span></div><div class="cd" id="autocd">'+autoText()+'</div>'+
    '<button class="btn demo'+(S.cDemo?' active':'')+'" data-act="cdemo">'+t('c_demo')+'</button></div>';}
function cSettings(){
  return '<div class="pagehead">'+ic('gear')+'<div><h1>'+t('c_settings')+'</h1><p>'+t('c_set_sub')+'</p></div></div><div class="setC">'+
    '<button class="btn tilebtn'+(S.lang==='de'?' active':'')+'" data-act="lang:de"><span style="font-size:38px;font-weight:800">DE</span>Deutsch</button>'+
    '<button class="btn tilebtn'+(S.lang==='en'?' active':'')+'" data-act="lang:en"><span style="font-size:38px;font-weight:800">EN</span>English</button>'+
    '<button class="btn tilebtn" data-act="clean">'+ic('clean')+t('clean')+'</button>'+
    '<button class="btn tilebtn" data-act="help">'+ic('help')+t('help')+'</button></div>'+
    '<div class="disclaimer" style="margin-top:30px;font-size:18px">'+t('demo')+'</div>';}
function renderC(app){
  var inRoom=S.cView==='room', body;
  if(S.cView==='settings')body=cSettings();
  else if(!inRoom)body=cHome();
  else if(S.room==='erf')body=cErf();
  else {var tabs=[['pres','monitor','pres'],['audio','speaker','audio'],['cam','video','c_cam'],['vc','users','vc']];
    body='<div class="tabs">'+tabs.map(function(x){return '<button class="btn'+(S.cTab===x[0]?' active':'')+'" data-act="ctab:'+x[0]+'">'+ic(x[1])+t(x[2])+'</button>';}).join('')+'</div>'+
      ({pres:cPres,audio:cAudio,cam:cCam,vc:cVC})[S.cTab]();}
  app.className='C'+(inRoom?' room':'');
  app.innerHTML='<div class="hdr"><div class="logo">'+LOGO_B+'<div>STADT<span>BOCHUM</span></div></div><div class="vsep"></div><span class="hname">'+t('c_hname')+'</span>'+
    (inRoom?'<span class="hroom">'+t(S.room==='sem'?'room_sem':'room_erf')+'</span>':'')+
    '<span class="clock" id="clk">'+clock()+'</span>'+
    (S.cView==='home'?'<button class="hicon" data-act="cview:settings" title="Einstellungen">'+ic('gear')+'</button>':'<button class="hicon" data-act="cview:home" title="Start">'+ic('home')+'</button>')+'</div>'+
    '<main>'+body+(inRoom?overlay():'')+'</main>';
}
function touchErf(){if(S.design==='C'&&S.cView==='room'&&S.room==='erf')S.rooms.erf.lastTouch=Date.now();}
setInterval(function(){var r=S.rooms.erf;
  if(r.power==='on'&&r.scenario===1&&Date.now()-r.lastTouch>=autoLimit()){r.scenario=2;save();
    if(S.design==='C'){toast(t('c_switched'));render();}}
  var el=document.getElementById('autocd');if(el)el.innerHTML=autoText();},500);

/* ---------------- render ---------------- */
function navBtns(list,icons){var cur=page();
  return list.map(function(p){return '<button class="btn'+(cur===p?' active':'')+'" data-act="nav:'+p+'">'+ic(icons[p])+'<span>'+t(p)+'</span></button>';}).join('');}
function overlay(){var p=R().power;if(p!=='booting'&&p!=='stopping')return '';
  return '<div class="overlay"><div class="spin"></div>'+(p==='booting'?t('st_boot'):t('st_stop'))+'</div>';}
function modal(){if(!S.confirm)return '';
  return '<div class="modal-bg" data-act="cancel"><div class="modal" data-act="noop"><h2>'+t('c_title')+'</h2><p>'+t('c_text')+'</p><div class="row">'+
  '<button class="btn" style="background:#e6eaef" data-act="cancel">'+t('cancel')+'</button>'+
  '<button class="btn" style="background:var(--red);color:#fff" data-act="off-ok">'+ic('power')+t('c_ok')+'</button></div></div></div>';}
function render(){
  var app=document.getElementById('app');
  if(S.design==='C'){renderC(app);}
  else if(S.design==='A'){var pg=PAGES[page()]();
    app.className='A';
    app.innerHTML='<div class="hdr"><div class="logo">'+LOGO_A+'<div>STADT<span>BOCHUM</span></div></div><div class="vsep"></div>'+
    '<div class="ttl"><b>'+t('title_a')+'</b><span>'+t('sub_a')+'</span></div>'+roomDD('monitor')+langDD()+'</div>'+
    '<div class="body"><nav>'+navBtns(['pres','vc','audio','system'],{pres:'monitor',vc:'video',audio:'sliders',system:'info'})+'</nav><main>'+pg+overlay()+'</main></div>'+
    '<div class="ftr"><button class="btn pwr-off" data-act="off">'+ic('power')+t('p_off')+'</button>'+statusPill()+
    '<button class="btn pwr-on" data-act="on">'+ic('power')+t('p_on')+'</button></div>'+modal();
  } else {var pg=PAGES[page()]();
    app.className='B';
    app.innerHTML='<div class="hdr"><div class="logo">'+LOGO_B+'<div>STADT<span>BOCHUM</span></div></div><div class="vsep"></div>'+
    '<div class="ttl"><b>'+t('title_b')+'</b><span>'+t('sub_b')+'</span></div>'+roomDD('pin')+'<div class="clock" id="clk">'+clock()+'</div></div>'+
    '<div class="body"><nav>'+navBtns(['start','pres','audio','vc','system'],{start:'home',pres:'monitor',audio:'speaker',vc:'video',system:'info'})+'</nav>'+
    '<div class="right"><main>'+pg+overlay()+'</main><div class="ftr"><button class="btn pwr-off" data-act="off">'+ic('power')+t('p_off')+'</button>'+statusPill()+
    '<button class="btn pwr-on" data-act="on">'+ic('power')+t('p_on')+'</button></div></div></div>'+modal();
  }
  document.documentElement.lang=S.lang;
  document.querySelectorAll('#ctrl [data-design]').forEach(function(b){b.classList.toggle('on',b.dataset.design===S.design);});
  save();
}

/* ---------------- actions ---------------- */
var toastTimer;
function toast(msg){var el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){el.classList.remove('show');},2400);}
function powerOn(room){var r=S.rooms[room];if(r.power==='on'||r.power==='booting')return;
  r.power='booting';r.display=true;r.lastTouch=Date.now();render();setTimeout(function(){if(r.power==='booting'){r.power='on';render();}},2500);}
function ensureOn(){var r=R();if(r.power==='off'||r.power==='stopping'){toast(t('autoon'));powerOn(S.room);}}
function powerOff(room){var r=S.rooms[room];r.power='stopping';r.inCall=false;r.share=false;render();
  setTimeout(function(){if(r.power==='stopping'){r.power='off';render();}},1600);}
function act(a){
  var p=a.split(':'),k=p[0],v=p[1],r=R();
  if(k!=='dd'&&k!=='noop')S.dd=null;
  switch(k){
    case 'noop':return;
    case 'dd':S.dd=S.dd===v?null:v;break;
    case 'nav':if(S.design==='A')S.pageA=v;else S.pageB=v;break;
    case 'src':r.source=v;ensureOn();break;
    case 'room':S.room=v;break;
    case 'lang':S.lang=v;break;
    case 'mode':r.mode=v;ensureOn();break;
    case 'mute':r.mu[v]=!r.mu[v];break;
    case 'on':powerOn(S.room);return;
    case 'off':if(r.power==='off'||r.power==='stopping')return;S.confirm=true;break;
    case 'cancel':S.confirm=false;break;
    case 'off-ok':S.confirm=false;powerOff(S.room);return;
    case 'call':if(r.inCall){r.inCall=false;r.share=false;}else{ensureOn();r.inCall=true;r.callStart=Date.now();r.mode='vc';}break;
    case 'preset':r.preset=+v;break;
    case 'cam':r.cam=!r.cam;break;
    case 'share':r.share=!r.share;break;
    case 'display':if(r.power!=='on'){ensureOn();}else r.display=!r.display;break;
    case 'help':toast(t('help_t'));break;
    case 'clean':startClean();break;
    case 'croom':S.room=v;S.cView='room';break;
    case 'cview':S.cView=v;break;
    case 'ctab':S.cTab=v;break;
    case 'cpow':if(v==='on'){powerOn(S.room);}else if(isOn(r)){powerOff(S.room);}return;
    case 'step':r.lv[v]=Math.max(0,Math.min(100,r.lv[v]+(+p[2])));break;
    case 'scen':r.scenario=+v;r.lastTouch=Date.now();ensureOn();break;
    case 'cdemo':S.cDemo=!S.cDemo;S.rooms.erf.lastTouch=Date.now();break;
  }
  render();
}
var screen=document.getElementById('screen');
screen.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){if(S.dd){S.dd=null;render();}return;}
  if(el.dataset.act==='cancel'&&el.classList.contains('modal-bg')&&e.target!==el)return;
  act(el.dataset.act);
});

/* sliders */
var drag=null;
function setLevel(el,clientX){var rc=el.getBoundingClientRect();var v=Math.round(Math.max(0,Math.min(1,(clientX-rc.left)/rc.width))*100);
  var key=el.dataset.sl;R().lv[key]=v;
  document.querySelectorAll('[data-sl="'+key+'"]').forEach(function(s){s.querySelector('.sl-fill').style.width=v+'%';s.querySelector('.sl-th').style.left=v+'%';});
  document.querySelectorAll('[data-pct="'+key+'"]').forEach(function(s){s.textContent=v+' %';});}
screen.addEventListener('pointerdown',function(e){touchErf();var el=e.target.closest('.sl');if(!el)return;
  e.preventDefault();drag=el;try{el.setPointerCapture(e.pointerId);}catch(x){}setLevel(el,e.clientX);});
screen.addEventListener('pointermove',function(e){if(drag)setLevel(drag,e.clientX);});
function endDrag(){if(drag){drag=null;save();}}
screen.addEventListener('pointerup',endDrag);screen.addEventListener('pointercancel',endDrag);

/* screen cleaning */
var cleanTimer;
function startClean(){var el=document.getElementById('clean'),n=15;document.getElementById('cleanTxt').textContent=t('clean_t');
  document.getElementById('cleanN').textContent=n;el.classList.add('show');clearInterval(cleanTimer);
  cleanTimer=setInterval(function(){n--;document.getElementById('cleanN').textContent=n;if(n<=0){clearInterval(cleanTimer);el.classList.remove('show');}},1000);}

/* clock + call timer */
setInterval(function(){var c=document.getElementById('clk');if(c)c.textContent=clock();
  document.querySelectorAll('.calltime').forEach(function(x){x.textContent=callTime();});},1000);

/* design switch + fullscreen */
document.querySelectorAll('#ctrl [data-design]').forEach(function(b){b.addEventListener('click',function(){S.design=b.dataset.design;S.dd=null;S.confirm=false;render();});});
var fsBtn=document.getElementById('fsBtn');var de=document.documentElement;
var reqFS=de.requestFullscreen||de.webkitRequestFullscreen;
if(!reqFS){fsBtn.style.display='none';}
fsBtn.addEventListener('click',function(){
  if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
  try{var pr=reqFS.call(de);if(pr&&pr.then)pr.then(function(){try{window.screen.orientation&&window.screen.orientation.lock&&window.screen.orientation.lock('landscape').catch(function(){});}catch(x){}}).catch(function(){});}catch(x){}
});

/* scale the panel to fit */
function fit(){var dev=document.getElementById('device');var W=1336,H=776;
  var vw=window.innerWidth,vh=window.innerHeight;var side=vw>vh?(EMB?16:120):16;var bottom=vw>vh?8:(EMB?16:140);
  var s=Math.min((vw-side)/W,(vh-bottom)/H);
  dev.style.transform='translate(-50%,-50%) scale('+s+')';
  if(vw<=vh)dev.style.top='calc(50% - 50px)';else dev.style.top='50%';}
window.addEventListener('resize',fit);window.addEventListener('orientationchange',function(){setTimeout(fit,200);});
fit();render();
})();
</script>
