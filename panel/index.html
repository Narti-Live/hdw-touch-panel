<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111317">
<title>HdW-Labor Mediensteuerung</title>
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --line:#e2e5ea; --line2:#cfd4db;
  --text:#14181e; --muted:#5b6471; --faint:#8a929d;
  --accent:#1f5fcc; --accent-d:#174a9f; --accent-soft:#e8f0fc;
  --ok:#17834a; --ok-soft:#e5f4ec; --danger:#c42f29; --danger-soft:#fcebea; --warn:#b26b00; --warn-soft:#fff3df;
  --off:#a3abb5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#111317;overflow:hidden;color:var(--text);
  font-family:"Segoe UI",Roboto,"Helvetica Neue",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
button{font-family:inherit;color:inherit}

/* device frame: TS-770 tabletop, 1280x800 */
#device{position:absolute;left:50%;top:50%;width:1324px;height:844px;padding:22px;border-radius:30px;transform-origin:center;
  background:linear-gradient(160deg,#26292e,#0b0c0e 55%,#1a1c20);box-shadow:0 0 0 1.5px #34373d inset,0 24px 60px rgba(0,0,0,.55)}
.screen{position:relative;width:1280px;height:800px;overflow:hidden;background:var(--bg);border-radius:6px}

/* prototype controls (outside the panel, not part of the UI) */
#proto{position:fixed;left:max(8px,env(safe-area-inset-left));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:50;width:56px}
#proto button{height:46px;border-radius:10px;border:1px solid #33373e;background:#202329;color:#c8ced6;font-size:11px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
#proto button.on{background:#1f5fcc;border-color:#3b78e0;color:#fff}
#proto button svg.i{font-size:18px}
#proto small{color:#6f7782;font-size:9px;text-align:center;letter-spacing:.05em;margin-top:4px}
#rotate{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));text-align:center;color:#9aa2ad;font-size:14px;display:none}
@media (orientation:portrait){#rotate{display:block}#proto{top:auto;bottom:50px;left:50%;transform:translateX(-50%);flex-direction:row;width:auto}#proto button{width:60px}#proto small{display:none}}

/* header */
.hdr{height:76px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px 0 28px;gap:18px}
.hdr .room b{display:block;font-size:26px;font-weight:700;letter-spacing:-.01em}
.hdr .room span{font-size:15px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;background:var(--bg);font-size:15px;color:var(--muted);white-space:nowrap}
.chip .d{width:10px;height:10px;border-radius:50%;background:var(--off)}
.chip.ok .d{background:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.warn .d{background:var(--warn)}
.chip.blue{background:var(--accent-soft);color:var(--accent-d)} .chip.blue .d{background:var(--accent)}
.hdr .sp{flex:1}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;height:46px;min-width:58px;padding:0 14px;border-radius:9px;font-size:16px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button svg.i{font-size:20px}
.seg button.on{background:var(--surface);color:var(--accent-d);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:active{transform:scale(.96)}
.clock{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);min-width:64px;text-align:right}
.pwr{width:56px;height:56px;border-radius:14px;border:1.5px solid #f0c5c2;background:var(--danger-soft);color:var(--danger);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pwr svg.i{font-size:30px;stroke-width:2.2}
.pwr:active{transform:scale(.94);background:#f8d6d4}

/* layout */
.body{display:flex;height:724px}
nav{width:128px;background:var(--surface);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:8px}
nav button{border:0;background:none;border-radius:14px;height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer}
nav button svg.i{font-size:32px}
nav button.on{background:var(--accent);color:#fff}
nav button:active{transform:scale(.95)}
nav .xsep{height:1px;background:var(--line);margin:4px 8px;position:relative}
nav .xsep span{position:absolute;left:50%;top:-8px;transform:translateX(-50%);background:var(--surface);padding:0 6px;font-size:10px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase}
main{flex:1;padding:24px 30px;position:relative;overflow:hidden}
.ph{margin-bottom:20px}
.ph h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.01em}
.ph p{margin:4px 0 0;font-size:17px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.card h2{margin:0 0 4px;font-size:21px;font-weight:700;display:flex;align-items:center;gap:12px}
.card h2 svg.i{font-size:28px;color:var(--muted)}
.card h2 .chip{margin-left:auto;height:30px;font-size:14px}
.card .sub{font-size:15px;color:var(--muted);margin:0 0 16px}
.card.dim{opacity:.45;pointer-events:none}

/* buttons */
.btn{border:1.5px solid var(--line2);background:var(--surface);border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;font-size:18px;font-weight:600;transition:background .12s,border-color .12s,color .12s}
.btn:active{transform:scale(.97)}
.btn svg.i{font-size:28px}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.red.on{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.green.on{background:var(--ok);border-color:var(--ok);color:#fff}
.btns{display:grid;gap:12px}
.btns.c2{grid-template-columns:1fr 1fr} .btns.c3{grid-template-columns:repeat(3,1fr)} .btns.c4{grid-template-columns:repeat(4,1fr)}
.btns .btn{height:78px}
.btns.tall .btn{height:104px;flex-direction:column;gap:8px}
.btns.slim .btn{height:58px;font-size:17px}
.tile{border:1.5px solid var(--line2);background:var(--surface);border-radius:18px;cursor:pointer;display:flex;align-items:center;gap:22px;padding:0 26px;text-align:left;height:150px;position:relative}
.tile:active{transform:scale(.98)}
.tile>svg.i{font-size:54px;color:var(--accent)}
.tile b{display:block;font-size:24px}
.tile span{display:block;font-size:16px;color:var(--muted);margin-top:4px;line-height:1.35}
.tile.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tile.on>svg.i,.tile.on span{color:#fff}
.tile .ck{position:absolute;right:20px;top:18px;width:32px;height:32px;border-radius:50%;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center}
.tile.on .ck{color:var(--accent)}
.tile .ck svg.i{font-size:20px;stroke-width:3}

/* level bar (value display + steps) */
.lvl{display:flex;align-items:center;gap:14px}
.lvl .step{width:64px;height:64px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);font-size:34px;font-weight:300;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.lvl .step:active{transform:scale(.94);background:var(--bg)}
.lvl .barw{flex:1}
.bar{position:relative;height:40px;border-radius:12px;background:#e7eaee;overflow:hidden;cursor:pointer;touch-action:none}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:12px 0 0 12px}
.bar.muted .fill{background:var(--off)}
.bar .ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 2px),rgba(255,255,255,.55) calc(10% - 2px),rgba(255,255,255,.55) 10%)}
.lvl .mm{display:flex;justify-content:space-between;font-size:13px;color:var(--faint);margin-top:5px}
.lvl .val{width:96px;height:64px;border-radius:12px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.lvl .val.muted{color:var(--danger);font-size:16px}
.mute{width:64px;height:64px;border-radius:14px;border:1.5px solid var(--line2);background:var(--surface);cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.mute svg.i{font-size:30px}
.mute.on{background:var(--danger);border-color:var(--danger);color:#fff}
.mute:active{transform:scale(.94)}
.row{display:flex;align-items:center;gap:16px}
.row+.row{margin-top:16px}
.lab{width:200px;font-size:18px;font-weight:600;flex:none}
.lab small{display:block;font-size:14px;font-weight:400;color:var(--muted)}

/* status list */
.st{list-style:none;margin:0;padding:0}
.st li{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:17px}
.st li:last-child{border:0}
.st li>span:first-child{color:var(--muted)}

/* devices table */
.dev{display:grid;grid-template-columns:230px 1fr;gap:12px 18px;align-items:center}
.dev .nm{font-size:18px;font-weight:600}
.dev .nm small{display:block;font-size:14px;font-weight:400;color:var(--muted)}
.dev .ctl{display:flex;gap:10px;flex-wrap:wrap}
.dev .ctl .btn{height:56px;padding:0 18px;font-size:16px}
.dev .ctl .btn svg.i{font-size:22px}
.dev .ctl .gl{font-size:13px;color:var(--faint);width:100%;margin:-4px 0 -6px}
.hr{grid-column:1/-1;height:1px;background:var(--line)}

/* camera */
.ptz{display:grid;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(3,76px);gap:8px}
.ptz .btn{height:auto;padding:0}
.ptz .btn svg.i{font-size:32px}
.ptz .c{background:var(--bg);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted);text-align:center}

/* room diagram */
.diagram{background:var(--bg);border-radius:14px;padding:16px;display:flex;gap:10px;height:250px}
.part{flex:1;border:2px dashed #b9c1cc;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:15px;position:relative;background:var(--surface)}
.part h4{margin:0 0 4px;font-size:17px}
.part .it{display:flex;align-items:center;gap:8px;color:var(--muted)}
.part .it svg.i{font-size:20px;color:var(--text)}
.part .it.to{color:var(--accent-d);font-weight:600}
.joined{display:flex;gap:0;flex:1}
.joined .part{border-style:solid;border-color:var(--accent)}
.wall{width:8px;border-radius:4px;background:#5b6471;align-self:stretch}

/* overlays */
.ov{position:absolute;inset:0;background:rgba(17,20,26,.45);display:flex;align-items:center;justify-content:center;z-index:40}
.dlg{width:600px;background:var(--surface);border-radius:22px;padding:32px 34px;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.dlg h3{margin:0 0 8px;font-size:28px;display:flex;align-items:center;gap:14px}
.dlg h3 svg.i{font-size:34px}
.dlg p{margin:0 0 26px;font-size:18px;color:var(--muted);line-height:1.45}
.dlg .btns .btn{height:68px}
.seq{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;align-items:center;justify-content:center}
.seq .box{width:620px}
.seq h3{font-size:30px;margin:0 0 6px}
.seq p{font-size:18px;color:var(--muted);margin:0 0 26px}
.seq ol{list-style:none;margin:0 0 26px;padding:0}
.seq li{display:flex;align-items:center;gap:16px;font-size:20px;padding:12px 0;color:var(--faint)}
.seq li .b{width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:none}
.seq li.done{color:var(--text)} .seq li.done .b{background:var(--ok);border-color:var(--ok);color:#fff}
.seq li.cur{color:var(--text);font-weight:600} .seq li.cur .b{border-color:var(--accent);border-top-color:transparent;animation:sp .8s linear infinite}
.seq li .b svg.i{font-size:20px;stroke-width:3}
@keyframes sp{to{transform:rotate(360deg)}}
.pbar{height:12px;border-radius:6px;background:#e1e5ea;overflow:hidden}
.pbar div{height:100%;background:var(--accent);transition:width .5s}
.offscr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--bg)}
.offscr .t{font-size:18px;color:var(--muted)}
.offscr h1{margin:0 0 30px;font-size:44px}
.startbtn{width:210px;height:210px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font-size:22px;font-weight:700;box-shadow:0 10px 30px rgba(31,95,204,.35)}
.startbtn svg.i{font-size:80px;stroke-width:2}
.startbtn:active{transform:scale(.96)}
.offscr .hint{margin-top:26px;font-size:17px;color:var(--muted)}
.offscr .top{position:absolute;top:22px;right:24px}
#toast{position:absolute;left:50%;bottom:28px;transform:translate(-50%,16px);background:#1b222c;color:#fff;padding:14px 24px;border-radius:12px;font-size:18px;opacity:0;transition:.2s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
.note{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--muted);margin-top:14px;line-height:1.4}
.note svg.i{font-size:20px;margin-top:1px}
.timer{display:flex;align-items:center;gap:18px}
.timer .pbar{flex:1;height:16px;border-radius:8px}
.timer .pbar div{background:var(--warn)}
.timer .tv{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;width:80px;text-align:right}

/* ===== Design skins: same functions, different look ===== */
.logo{display:flex;align-items:center;gap:12px;flex:none}
.logo svg{width:42px;height:42px}
.logo div{font-size:18px;font-weight:600;line-height:1}
.logo div span{display:block;font-size:23px;font-weight:800}
.vsep{width:1.5px;height:44px;background:var(--line2);flex:none}
/* A: light header with navy logo, wide labelled side bar */
.skin-A{--accent:#0c3a78;--accent-d:#0c3a78;--accent-soft:#e3ebf6;--bg:#f3f6fa}
.skin-A .hdr{background:#eef2f7}
.skin-A .logo{color:#0c3a78}
.skin-A nav{width:226px;background:#f3f6fa;border-right:0;padding:16px 10px 16px 12px;gap:8px}
.skin-A nav button{flex-direction:row;justify-content:flex-start;height:70px;padding:0 16px;gap:14px;font-size:17px;background:#e5e9ef;color:var(--text);border-radius:12px}
.skin-A nav button svg.i{font-size:30px}
.skin-A nav button.on{background:#0c3a78;color:#fff}
.skin-A nav .xsep span{background:#f3f6fa}
.skin-A .card{background:#f8fafc;border-color:#e1e6ec}
.skin-A main{background:#fff}
/* B: angled navy logo block, light side strip, large clock */
.skin-B{--accent:#0c3a78;--accent-d:#0c3a78;--accent-soft:#e3ebf6}
.skin-B .hdr{padding-left:0;background:#f3f5f8}
.skin-B .logo{height:76px;width:250px;background:#0c3a78;color:#fff;padding-left:30px;clip-path:polygon(0 0,100% 0,86% 100%,0 100%);margin-right:4px}
.skin-B .vsep{display:none}
.skin-B .clock{font-size:28px;color:var(--text);border-left:1.5px solid #555;padding-left:18px}
.skin-B nav{width:210px;background:#f1f3f6;border-right:0;padding:20px 12px;gap:10px}
.skin-B nav button{flex-direction:row;justify-content:flex-start;height:62px;padding:0 14px;gap:14px;font-size:17px;background:#e6e9ee;color:var(--text);border-radius:9px}
.skin-B nav button svg.i{font-size:28px}
.skin-B nav button.on{background:#0c3a78;color:#fff}
.skin-B nav .xsep span{background:#f1f3f6}
.skin-B main{background:#fff}
.skin-B .card{background:#f4f6f8;border:0;border-radius:10px}
/* C: dark header, tabs across the top, dark selection colour */
.skin-C{--accent:#1e2733;--accent-d:#1e2733;--accent-soft:#e9ecf0}
.skin-C .hdr{background:#1e2733;color:#fff;border:0}
.skin-C .hdr .room span{color:#aeb7c3}
.skin-C .vsep{background:#6f7a89}
.skin-C .seg{background:#2b3542;border-color:#3a4554}
.skin-C .seg button{color:#c3cbd6}
.skin-C .seg button.on{background:#fff;color:#1e2733}
.skin-C .clock{color:#fff}
.skin-C .chip{background:#2b3542;color:#dfe5ec}
.skin-C .chip.warn{background:#4a3a1a;color:#ffd38a}
.skin-C .pwr{background:#3a2326;border-color:#6b3a3d;color:#ff8f87}
.skin-C .body{flex-direction:column}
.skin-C nav{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:12px 20px;gap:10px;background:#f6f7f9}
.skin-C nav button{flex:1;flex-direction:row;height:60px;gap:10px;font-size:16px;background:#eceef1;color:var(--text);border-radius:9px}
.skin-C nav button svg.i{font-size:26px}
.skin-C nav button.on{background:#1e2733;color:#fff}
.skin-C nav .xsep{width:1.5px;height:auto;margin:6px 4px}
.skin-C nav .xsep span{display:none}
.skin-C main{padding:20px 30px}
.skin-C .ph{margin-bottom:14px}
.skin-C .tile>svg.i{color:#1e2733}
.skin-C .tile.on>svg.i{color:#fff}

.skin-A nav button span,.skin-B nav button span,.skin-C nav button span{white-space:nowrap;text-align:left}
.skin-A nav button,.skin-B nav button{font-size:16px}
.skin-B .logo{width:222px;padding-left:24px}
.skin-B .room span,.skin-A .room span,.skin-C .room span{white-space:nowrap}
.skin-B .hdr{gap:14px}
.skin-C .chip.blue{background:#2b3542;color:#dfe5ec}
.skin-C .chip.blue .d{background:#7fb0ff}
.skin-C nav button{font-size:14px;padding:0 8px;gap:8px}
.skin-C .startbtn{box-shadow:0 10px 30px rgba(30,39,51,.35)}
</style>
</head>
<body>
<div id="device"><div class="screen" id="screen"><div id="app"></div><div id="toast"></div></div></div>
<div id="proto">
  <button data-proto="sem" title="Panel Seminarraum">Seminar-<br>raum</button>
  <button data-proto="erf" title="Panel Erfahrungsraum">Erfahr.-<br>raum</button>
  <button data-proto="demo" title="20-Minuten-Timer als 20 Sekunden testen">Timer<br>20 s</button>
  <button id="fsBtn" title="Vollbild"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <small>PROTOTYP</small>
</div>
<div id="rotate">↻ Gerät quer halten · Rotate to landscape</div>
<script>
(function(){
"use strict";
/* ---------- icons (symbol library) ---------- */
var P={
 power:'<path d="M12 3v8"/><path d="M6.6 6.6a7.8 7.8 0 1010.8 0"/>',
 home:'<path d="M4 11l8-7 8 7v9h-5.5v-6h-5v6H4z"/>',
 monitor:'<rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8"/>',
 speaker:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9a4.2 4.2 0 010 6M19.2 6.5a8 8 0 010 11"/>',
 speakerOff:'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>',
 mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21M8.5 21h7"/>',
 micOff:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21M8.5 21h7M3 3l18 18"/>',

function semDefault(){return {power:'off',level:'simple',page:'start',divided:false,preset:null,
  disp:{1:{src:'wl',pw:'on',fmt:'auto'},2:{src:'wl',pw:'on',fmt:'auto'}},
  vol:{room:60,A:60,B:60},mute:{room:false,A:false,B:false},
  vc:false,micMute:true,toVC:true,mic:{all:0,1:0,2:0,3:0},micM:{1:false,2:false,3:false},
  cam:{pos:1,freeze:false,shutter:false,zoom:1},amp:'on',dsp:'on'};}
function erfDefault(){return {power:'off',level:'simple',page:'start',preset:'main',src:'ws',rendering:'run',
  vol:{room:55},mute:{room:false},proj:{pw:'on',fmt:'auto',dowser:false},amp:'on',lastTouch:Date.now()};}
var SKIN='A';try{var qs=new URLSearchParams(location.search).get('design');SKIN=window.__SKIN||qs||'A';if(['A','B','C'].indexOf(SKIN)<0)SKIN='A';}catch(e){}
var S={lang:'de',panel:'sem',demo:false,sem:semDefault(),erf:erfDefault()};
var KEY='hdw-panel-v2-'+SKIN;
try{var sv=JSON.parse(localStorage.getItem(KEY)||'null');if(sv&&sv.sem&&sv.erf){S=sv;['sem','erf'].forEach(function(k){var r=S[k];if(r.power==='starting')r.power='on';if(r.power==='stopping')r.power='off';r.confirm=null;r.seq=null;});S.erf.lastTouch=Date.now();}}catch(e){}
try{var q=new URLSearchParams(location.search);if(q.get('room')==='erf'||q.get('room')==='sem')S.panel=q.get('room');if(q.get('lang')==='en'||q.get('lang')==='de')S.lang=q.get('lang');}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S,function(k,v){return (k==='confirm'||k==='seq'||k==='storeMode')?undefined:v;}));}catch(e){}}
function R(){return S[S.panel];}
function t(k){return T[S.lang][k]!=null?T[S.lang][k]:k;}
function getP(path){var o=R();path.split('.').forEach(function(p){o=o[p];});return o;}
function setP(path,v){var ps=path.split('.'),o=R();for(var i=0;i<ps.length-1;i++)o=o[ps[i]];o[ps[ps.length-1]]=v;}

/* ---------- components ---------- */
// level: value bar with steps, min/max, value field. unit: '%' (0..100 step 5) or 'dB' (-30..+6 step 3)
var UNITS={pct:{min:0,max:100,step:5,f:function(v){return v+' %';}},db:{min:-30,max:6,step:3,f:function(v){return (v>0?'+':'')+v+' dB';}}};
function level(path,unit,mutePath){var u=UNITS[unit],v=getP(path),m=mutePath?getP(mutePath):false;var pct=(v-u.min)/(u.max-u.min)*100;
  return '<div class="lvl"><button class="step" data-act="step:'+path+':'+unit+':-1">−</button><div class="barw"><div class="bar'+(m?' muted':'')+'" data-bar="'+path+'" data-unit="'+unit+'"><div class="fill" style="width:'+pct+'%"></div><div class="ticks"></div></div>'+
  '<div class="mm"><span>'+u.f(u.min)+'</span><span>'+u.f(u.max)+'</span></div></div><button class="step" data-act="step:'+path+':'+unit+':1">+</button>'+
  '<div class="val'+(m?' muted':'')+'" data-val="'+path+'">'+(m?t('muted'):u.f(v))+'</div>'+
  (mutePath?'<button class="mute'+(m?' on':'')+'" data-act="toggle:'+mutePath+'" title="'+t('mute')+'">'+ic(m?'speakerOff':'speaker')+'</button>':'')+'</div>';}
function btn(act,label,icon,on,cls){return '<button class="btn'+(on?' on':'')+(cls?' '+cls:'')+'" data-act="'+act+'">'+(icon?ic(icon):'')+'<span>'+label+'</span></button>';}
function chip(text,cls){return '<span class="chip '+(cls||'')+'"><span class="d"></span>'+text+'</span>';}
function ph(h,p){return '<div class="ph"><h1>'+h+'</h1><p>'+p+'</p></div>';}
function clock(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}

/* ---------- Seminarraum pages ---------- */
function srcName(s){return s==='pc'?t('src_pc'):t('src_wl');}
function dispState(n){var d=R().disp[n];if(d.pw==='off')return t('is_off');if(d.pw==='sb')return t('is_sb');return srcName(d.src);}
function semStart(){var r=R();
  function tile(id,icon){var on=r.preset===id;return '<button class="tile'+(on?' on':'')+'" data-act="preset:'+id+'">'+ic(icon)+'<div><b>'+t('p_'+id)+'</b><span>'+t('p_'+id+'_t')+'</span></div>'+(on?'<span class="ck">'+ic('check')+'</span>':'')+'</button>';}
  return ph(t('start_h'),t('start_p'))+'<div class="grid2" style="margin-bottom:20px">'+tile('pres','present')+tile('vc','vc')+'</div>'+
  '<div class="card"><h2>'+ic('info')+t('now')+'</h2><ul class="st">'+
  '<li><span>'+t('disp1')+' ('+t('disp1s')+')</span><b>'+dispState(1)+'</b></li>'+
  '<li><span>'+t('disp2')+' ('+t('disp2s')+')</span><b>'+dispState(2)+'</b></li>'+
  '<li><span>'+t('vol')+'</span><b>'+(r.divided?(r.mute.A?t('muted'):r.vol.A+' %')+' / '+(r.mute.B?t('muted'):r.vol.B+' %'):(r.mute.room?t('muted'):r.vol.room+' %'))+'</b></li>'+
  '<li><span>'+t('vc_h')+'</span><b>'+(r.vc?t('vc_on')+' · '+(r.micMute?t('vc_mic_off'):t('vc_mic_on')):t('vc_off'))+'</b></li></ul></div>';}
function semVideo(){var r=R();
  function col(n){var d=r.disp[n];var off=d.pw!=='on';
    return '<div class="card'+(off?' dim':'')+'"><h2>'+ic('monitor')+t('disp'+n)+chip(off?(d.pw==='sb'?t('is_sb'):t('is_off')):srcName(d.src),off?'':'ok')+'</h2><p class="sub">'+t('disp'+n+'s')+'</p>'+
    '<div class="btns c2 tall">'+btn('src:'+n+':pc',t('src_pc')+'<br><small style="font-weight:400;opacity:.8">'+t('src_pc_s')+'</small>','pc',d.src==='pc')+
    btn('src:'+n+':wl',t('src_wl')+'<br><small style="font-weight:400;opacity:.8">'+t('src_wl_s')+'</small>','wireless',d.src==='wl')+'</div>'+
    (n===1&&r.vc?'<div class="note">'+ic('vc')+t('vc_h')+': '+t('vc_on')+'</div>':'')+'</div>';}
  return ph(t('video_h'),t('video_p'))+'<div class="grid2">'+col(1)+col(2)+'</div>';}
function semAudio(){var r=R();
  if(!r.divided)return ph(t('audio_h'),t('audio_p'))+'<div class="card"><h2>'+ic('speaker')+t('vol_room')+'</h2><p class="sub">'+t('chip_joined')+'</p>'+level('vol.room','pct','mute.room')+'</div>';
  return ph(t('audio_h'),t('audio_p'))+'<div class="card" style="margin-bottom:18px"><h2>'+ic('speaker')+t('vol_A')+'</h2><p class="sub">'+t('disp1')+' · '+t('disp1s')+'</p>'+level('vol.A','pct','mute.A')+'</div>'+
  '<div class="card"><h2>'+ic('speaker')+t('vol_B')+'</h2><p class="sub">'+t('disp2')+' · '+t('disp2s')+'</p>'+level('vol.B','pct','mute.B')+'</div>';}
function semVC(){var r=R();
  return ph(t('vc_h'),t('vc_p'))+'<div class="grid2"><div class="card"><h2>'+ic('vc')+t('vc_mode')+chip(r.vc?t('vc_on'):t('vc_off'),r.vc?'ok':'')+'</h2><p class="sub">'+t('p_vc_t')+'</p>'+
  '<div class="btns c2">'+btn('vc:1',t('vc_on'),'vc',r.vc,'green')+btn('vc:0',t('vc_off'),null,!r.vc)+'</div>'+
  '<h2 style="margin-top:22px">'+ic('ceilmic')+t('vc_mic')+'</h2><div class="btns c2" style="margin-top:12px">'+btn('micmute:0',t('vc_mic_on'),'mic',!r.micMute,'green')+btn('micmute:1',t('vc_mic_off'),'micOff',r.micMute,'red')+'</div></div>'+
  '<div class="card'+(r.vc?'':' dim')+'"><h2>'+ic('camera')+t('cam_pos')+'</h2><p class="sub">&nbsp;</p><div class="btns tall c3">'+[1,2,3].map(function(i){return btn('pos:'+i,t('pos'+i),'camera',r.cam.pos===i);}).join('')+'</div>'+
  '<div class="note">'+ic('info')+'<span>'+t('vc_note')+(r.divided?'<br>'+t('vc_partA'):'')+'</span></div></div></div>';}
function micRoute(n){var r=R();if(!r.divided)return t('to_disp1');return (n===2)?t('to_disp2'):t('to_disp1');}

/* ---------- sequences ---------- */
function runSeq(room,type){var r=S[room];
  var steps=type==='start'?(room==='sem'?['s1_sem','s2_sem','s3_sem']:['s1_erf','s2_erf','s3_erf']):(room==='sem'?['d1','d2_sem','d3_sem','d4']:['d1','d2_erf','d3_erf','d4']);
  r.seq={type:type,steps:steps,i:0};if(type==='stop')r.power='stopping';
  if(type==='stop'){if(room==='sem'){r.mute.room=r.mute.A=r.mute.B=true;}else r.mute.room=true;}
  render();
  var iv=setInterval(function(){r.seq.i++;
    if(type==='stop'){if(room==='sem'){if(r.seq.i===2){r.disp[1].pw=r.disp[2].pw='off';}if(r.seq.i===3){r.vc=false;r.micMute=true;}if(r.seq.i===4){r.amp=r.dsp='off';}}
      else{if(r.seq.i===2)r.rendering='pause';if(r.seq.i===3)r.proj.pw='off';if(r.seq.i===4)r.amp='off';}}
    if(r.seq.i>=steps.length){clearInterval(iv);
      setTimeout(function(){r.seq=null;
        if(type==='start'){r.power='on';r.page='start';
          if(room==='sem'){r.amp=r.dsp='on';r.disp[1].pw=r.disp[2].pw='on';r.mute={room:false,A:false,B:false};}
          else{r.amp='on';r.proj.pw='on';r.mute.room=false;r.preset='main';r.src='ws';r.rendering='run';r.lastTouch=Date.now();}}
        else{r.power='off';r.level='simple';}
        if(S.panel===room)render();},450);}
    if(S.panel===room)render();},800);}

/* ---------- actions ---------- */
var toastT;function toast(m){var el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove('show');},2200);}
function act(a){var p=a.split(':'),k=p[0],v=p[1],r=R();
  if(k==='noop')return;
  switch(k){
    case 'ask':r.confirm=v;break;
    case 'dismiss':r.confirm=null;break;
    case 'do':r.confirm=null;if(v==='start'||v==='stop'){runSeq(S.panel,v);return;}
      if(v==='join'){r.divided=false;r.vol.room=Math.max(r.vol.A,r.vol.B);}
      if(v==='divide'){r.divided=true;r.vol.A=r.vol.B=r.vol.room;}break;
    case 'lang':S.lang=v;break;
    case 'level':r.level=v;if(!allowed(r.page))r.page='start';break;
    case 'nav':r.page=v;r.storeMode=false;break;
    case 'step':{var u=UNITS[p[2]],cur=getP(v);setP(v,Math.max(u.min,Math.min(u.max,cur+u.step*(+p[3]))));break;}
    case 'toggle':setP(v,!getP(v));break;
    /* seminar */
    case 'preset':r.preset=v;
      if(v==='pres'){r.disp[1].src=r.disp[2].src='wl';r.vc=false;r.micMute=true;}
      else{r.disp[1].src='pc';r.vc=true;r.micMute=false;r.toVC=true;r.cam.shutter=false;}
      r.disp[1].pw='on';r.disp[2].pw='on';toast(t('p_'+v)+' ✓');break;
    case 'src':r.disp[v].src=p[2];r.preset=null;break;
    case 'vc':r.vc=v==='1';if(r.vc){r.disp[1].src='pc';r.micMute=false;}else r.micMute=true;r.preset=null;break;
    case 'micmute':r.micMute=v==='1';break;
    case 'tovc':r.toVC=v==='1';break;
    case 'pos':if(r.storeMode){r.storeMode=false;r.cam.pos=+v;toast(t('stored')+': '+t('pos'+v));}else r.cam.pos=+v;break;
    case 'store':r.storeMode=!r.storeMode;break;
    case 'ptz':break;
    case 'zoom':r.cam.zoom=Math.max(1,Math.min(15,r.cam.zoom+(+v)));break;
    case 'freeze':r.cam.freeze=!r.cam.freeze;break;
    case 'shutter':r.cam.shutter=!r.cam.shutter;break;
    case 'dpw':r.disp[v].pw=p[2];break;
    case 'dfmt':r.disp[v].fmt=p.slice(2).join(':');break;
    case 'amp':r.amp=v;break;
    case 'dsp':r.dsp=v;break;
    case 'room':if((v==='1')!==r.divided)r.confirm=(v==='1')?'divide':'join';break;
    /* experience room */
    case 'epreset':r.preset=v;if(v==='main'){r.src='ws';r.rendering='run';}else{r.src='ctl';r.rendering='pause';}r.lastTouch=Date.now();toast(t('p_'+v)+' ✓');break;
    case 'esrc':r.src=v;r.preset=null;if(v==='ws'&&r.rendering==='pause'){r.rendering='run';}break;
    case 'ppw':r.proj.pw=v;break;
    case 'pfmt':r.proj.fmt=p.slice(1).join(':');break;
    case 'dowser':r.proj.dowser=v==='1';break;
    case 'rend':r.rendering=v;if(v==='run'&&r.src==='ws'&&r.preset!=='main'&&r.preset!==null){}break;
  }
  render();}
var screen=document.getElementById('screen');
screen.addEventListener('click',function(e){var el=e.target.closest('[data-act]');if(!el)return;
  if(el.classList.contains('ov')&&e.target!==el)return;act(el.dataset.act);});
screen.addEventListener('pointerdown',function(){if(S.panel==='erf'&&S.erf.power==='on')S.erf.lastTouch=Date.now();},true);

/* bars: drag to set */
var drag=null;
function setFromX(el,x){var rc=el.getBoundingClientRect(),u=UNITS[el.dataset.unit];var f=Math.max(0,Math.min(1,(x-rc.left)/rc.width));
  var v=Math.round((u.min+f*(u.max-u.min))/u.step)*u.step;v=Math.max(u.min,Math.min(u.max,v));var path=el.dataset.bar;setP(path,v);
  el.querySelector('.fill').style.width=((v-u.min)/(u.max-u.min)*100)+'%';var val=document.querySelector('[data-val="'+path+'"]');if(val&&!val.classList.contains('muted'))val.textContent=u.f(v);}
screen.addEventListener('pointerdown',function(e){var el=e.target.closest('.bar');if(!el)return;e.preventDefault();drag=el;try{el.setPointerCapture(e.pointerId);}catch(x){}setFromX(el,e.clientX);});
screen.addEventListener('pointermove',function(e){if(drag)setFromX(drag,e.clientX);});
function end(){if(drag){drag=null;save();}}screen.addEventListener('pointerup',end);screen.addEventListener('pointercancel',end);

/* timers */
setInterval(function(){var c=document.getElementById('clk');if(c)c.textContent=clock();
  var r=S.erf;if(r.power==='on'&&r.preset==='main'&&Date.now()-r.lastTouch>=autoLimit()){r.preset='side';r.src='ctl';r.rendering='pause';save();if(S.panel==='erf'){toast(t('switched'));render();}}
  var tb=document.getElementById('timerbox');if(tb)tb.innerHTML=timerHTML();},500);

/* prototype controls */
document.querySelectorAll('#proto [data-proto]').forEach(function(b){b.addEventListener('click',function(){var k=b.dataset.proto;
  if(k==='demo'){S.demo=!S.demo;S.erf.lastTouch=Date.now();}else S.panel=k;render();});});
var fsBtn=document.getElementById('fsBtn'),de=document.documentElement,rq=de.requestFullscreen||de.webkitRequestFullscreen;
if(!rq)fsBtn.style.display='none';
fsBtn.addEventListener('click',function(){if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return;}
  try{var pr=rq.call(de);if(pr&&pr.then)pr.then(function(){try{window.screen.orientation.lock('landscape').catch(function(){});}catch(x){}}).catch(function(){});}catch(x){}});
function fit(){var d=document.getElementById('device'),W=1324,H=844,vw=innerWidth,vh=innerHeight,land=vw>vh;
  var s=Math.min((vw-(land?136:16))/W,(vh-(land?8:150))/H);d.style.transform='translate(-50%,-50%) scale('+s+')';d.style.left=land?'calc(50% + 32px)':'50%';d.style.top=land?'50%':'calc(50% - 50px)';}
addEventListener('resize',fit);addEventListener('orientationchange',function(){setTimeout(fit,200);});
fit();render();
})();
</script>
</body>
</html>
