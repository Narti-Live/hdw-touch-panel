<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HdW Touch Panel Designs</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#111317;--bar:#1b1e23;--line:#2c3037;--text:#e6e9ee;--muted:#9aa3ae;--accent:#1f5fcc;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",Roboto,"Helvetica Neue",-apple-system,Arial,sans-serif;overflow:hidden}
.wrap{display:flex;flex-direction:column;height:100%}
.bar{flex:none;display:flex;align-items:center;gap:6px;height:44px;background:var(--bar);border-bottom:1px solid var(--line);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));overflow-x:auto;white-space:nowrap}
.bar b{font-size:13px;color:var(--muted);font-weight:600;margin-right:6px}
.bar button,.bar a{height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text);font:600 13px/30px inherit;font-family:inherit;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.bar button:focus-visible,.bar a:focus-visible{outline:2px solid #8fb4f5;outline-offset:1px}
.bar .sp{flex:1;min-width:8px}
.bar a{color:#cfe0ff}
@media (max-width:900px){.bar b{display:none}}
iframe{flex:1;width:100%;border:0;display:block;background:var(--bg)}
</style>
</head><body><div class="wrap">
  <div class="bar" role="tablist">
    <b>HdW Touch Panel</b>
        <button data-v="a" role="tab">Design A</button>
    <button data-v="b" role="tab">Design B</button>
    <button data-v="c" role="tab">Design C</button>
    <span class="sp"></span>
    <a id="zip" href="HdW_touch_panel_screenshots.zip" target="_blank" rel="noopener">⬇ Screenshots (ZIP)</a>
    <a href="https://github.com/Narti-Live/hdw-touch-panel/blob/main/DESCRIPTION.md" target="_blank" rel="noopener">Beschreibung</a>
  </div>
  <iframe id="f" title="Touch panel prototype"></iframe>
</div>
<script>
(function(){
var MODE='files';
var SRC={a:'panel/index.html?design=A',b:'panel/index.html?design=B',c:'panel/index.html?design=C'};
var DATA={};
function dec(b){return new TextDecoder().decode(Uint8Array.from(atob(b),function(c){return c.charCodeAt(0);}));}
var cache={};
function show(v){if(!SRC[v])v='a';
  document.querySelectorAll('.bar button').forEach(function(b){var on=b.dataset.v===v;b.classList.toggle('on',on);b.setAttribute('aria-selected',on);});
  var f=document.getElementById('f');
  if(MODE==='files'){f.removeAttribute('srcdoc');f.src=SRC[v];}
  else{if(!cache.p)cache.p=dec(DATA.p);
    var html=cache.p.replace('<head>','<head><script>window.__SKIN="'+v.toUpperCase()+'"<\/script>');
    f.srcdoc=html;}
  if(location.hash!=='#'+v){try{history.replaceState(null,'','#'+v);}catch(e){location.hash=v;}}}
document.querySelectorAll('.bar button').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.v);});});
addEventListener('hashchange',function(){show(location.hash.slice(1));});
show(location.hash.slice(1)||'a');
})();
</script>

</body></html>
